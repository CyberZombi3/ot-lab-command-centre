<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OT Lab Guide</title>
<style>
:root{--bg:#0b0f14;--panel:#121922;--line:#243241;--text:#d7e1ea;--dim:#7f93a6;--cyan:#3fc5f0;--amber:#ffb020;
  --mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
nav{position:sticky;top:0;z-index:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 16px;
  background:#0e141c;border-bottom:1px solid var(--line)}
nav a{font:600 12px var(--mono);color:var(--dim);text-decoration:none;padding:5px 9px;border:1px solid var(--line);border-radius:6px}
nav a:hover{color:var(--cyan);border-color:var(--cyan)}
nav .home{color:#000;background:var(--cyan);border-color:var(--cyan)}
article{max-width:880px;margin:0 auto;padding:24px 16px 80px}
h1{font:700 26px var(--mono)}
h2{font:700 20px var(--mono);color:var(--cyan);border-top:1px solid var(--line);padding-top:28px;margin-top:36px;scroll-margin-top:60px}
h3{font:600 16px var(--mono);margin-top:24px;scroll-margin-top:60px}
a{color:var(--cyan)}
code{font:13px var(--mono);background:#06090d;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
pre{background:#06090d;border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto}
pre code{border:0;padding:0;background:none;color:#9fe8b9}
table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--panel)}
blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid var(--amber);background:#1d1810;border-radius:0 6px 6px 0}
blockquote p{margin:4px 0}
hr{border:0;border-top:1px solid var(--line)}
h4{font:600 15px var(--mono);color:var(--amber);margin:28px 0 8px}
h3+p strong:first-child{color:var(--cyan)}
details{margin:10px 0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
summary{cursor:pointer;font-weight:600;color:var(--cyan)}
details[open] summary{margin-bottom:6px}
</style>
</head>
<body>
<nav id="nav"><a class="home" href="/" target="_top" id="home">← Command Centre</a></nav>
<article id="doc">Loading guide…</article>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
fetch("/EXERCISES.md").then(r=>r.text()).then(md=>{
  const doc = document.getElementById("doc");
  doc.innerHTML = marked.parse(md);
  // Give headings stable ids: "Mission 3: ..." -> #mission-3, others -> slug
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  doc.querySelectorAll("h2,h3").forEach(h=>{
    const m = h.textContent.match(/^Mission (\d+)/);
    h.id = m ? `mission-${m[1]}` : slug(h.textContent);
    if(h.tagName==="H2"){
      const a = document.createElement("a");
      a.href = "#"+h.id; a.textContent = m ? `M${m[1]}` : h.textContent;
      document.getElementById("nav").appendChild(a);
    }
  });
  doc.querySelectorAll("a[href^='http']").forEach(a=>{ a.target="_blank"; a.rel="noopener"; });
  const jump = ()=>{ if(location.hash) document.querySelector(location.hash)?.scrollIntoView(); };
  jump(); window.addEventListener("hashchange", jump);
  // Inside the Command Centre's workspace the "back" link isn't needed
  if(window.top !== window) document.getElementById("home").remove();
}).catch(()=>{ document.getElementById("doc").textContent = "Couldn't load the guide. Is the Command Centre server running?"; });
</script>
</body>
</html>
